# Mounted at /opt/spark/conf/spark-defaults.conf, so spark-submit, pyspark
# and spark-shell in the spark container all write to SeaweedFS through S3A
# with the magic committer.

spark.master                                               local[4]
spark.ui.showConsoleProgress                               false

# S3A -> SeaweedFS (credentials match s3.json)
spark.hadoop.fs.s3a.endpoint                               http://seaweedfs:8333
spark.hadoop.fs.s3a.endpoint.region                        us-east-1
spark.hadoop.fs.s3a.path.style.access                      true
spark.hadoop.fs.s3a.connection.ssl.enabled                 false
spark.hadoop.fs.s3a.aws.credentials.provider               org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
spark.hadoop.fs.s3a.access.key                             spark
spark.hadoop.fs.s3a.secret.key                             spark-secret
# Smallest part S3 allows, so modest test files already span several parts.
spark.hadoop.fs.s3a.multipart.size                         5M

# S3A magic committer: tasks write straight to the destination as multipart
# uploads that are only completed at job commit, so nothing is renamed.
spark.hadoop.fs.s3a.committer.name                         magic
spark.hadoop.fs.s3a.committer.magic.enabled                true
spark.hadoop.mapreduce.outputcommitter.factory.scheme.s3a  org.apache.hadoop.fs.s3a.commit.S3ACommitterFactory
spark.sql.sources.commitProtocolClass                      org.apache.spark.internal.io.cloud.PathOutputCommitProtocol
spark.sql.parquet.output.committer.class                   org.apache.spark.internal.io.cloud.BindingParquetOutputCommitter
